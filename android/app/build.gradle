plugins {
    id 'com.android.application'
}

// Stable signing requires a user-controlled keystore. Nothing private is checked into GitHub.
def stableKeystore = System.getenv('JARVIS_RELEASE_STORE_FILE')
def stableStorePassword = System.getenv('JARVIS_RELEASE_STORE_PASSWORD')
def stableAlias = System.getenv('JARVIS_RELEASE_KEY_ALIAS')
def stableKeyPassword = System.getenv('JARVIS_RELEASE_KEY_PASSWORD')
def stableSigningReady = [stableKeystore, stableStorePassword, stableAlias, stableKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace 'com.andriy.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.andriy.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 38
        versionName '0.1.28'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Optional user-requested Pixel/ARM64 delivery: universal stable is
        // still built by default when the property is not set.
        if (project.hasProperty('jarvisArm64Only')) {
            ndk { abiFilters 'arm64-v8a' }
        }
    }

    signingConfigs {
        jarvisStable {
            if (stableSigningReady) {
                storeFile file(stableKeystore)
                storePassword stableStorePassword
                keyAlias stableAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Debug is for CI/local testing only; ephemeral signing cannot deliver in-place updates.
            applicationIdSuffix '.preview'
            manifestPlaceholders = [appLabel: 'Джарвіс Тест']
        }
        release {
            // Freeze this stable applicationId forever; changes break in-place upgrades.
            // All later stable releases can upgrade in-place with the same signing key.
            applicationIdSuffix '.stable'
            manifestPlaceholders = [appLabel: 'Джарвіс']
            if (stableSigningReady) signingConfig signingConfigs.jarvisStable
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Spotify App Remote 0.8.0 is distributed as an official GitHub release AAR,
// not on Maven Central. Download it only during an Android build.
// It is not committed into the user's GitHub source repository.
def spotifyRemoteAar = file("$projectDir/libs/spotify-app-remote-release-0.8.0.aar")
tasks.register('downloadSpotifyAppRemote') {
    outputs.file spotifyRemoteAar
    doLast {
        if (spotifyRemoteAar.isFile() && spotifyRemoteAar.length() == 132749L) return
        spotifyRemoteAar.parentFile.mkdirs()
        def tmp = file(spotifyRemoteAar.path + '.download')
        def official = new URL('https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar')
        try {
            def connection = official.openConnection()
            connection.setConnectTimeout(20000)
            connection.setReadTimeout(30000)
            connection.setRequestProperty('User-Agent', 'JARVIS-Android-Build')
            connection.getInputStream().withCloseable { input ->
                tmp.withOutputStream { output -> output << input }
            }
            if (tmp.length() != 132749L)
                throw new GradleException('Spotify official AAR has an unexpected size')
            if (!tmp.renameTo(spotifyRemoteAar))
                throw new GradleException('Could not install Spotify SDK AAR')
        } finally {
            tmp.delete()
        }
    }
}
// AAR extraction and JNI merges for assembleRelease run BEFORE javac.
 // Download Spotify's official AAR before *any* task that consumes its native
 // or Java classes, including signed release packaging.
tasks.matching { it.name == 'preBuild' ||
                 it.name == 'mergeReleaseNativeLibs' ||
                 it.name == 'mergeDebugNativeLibs' ||
                 it.name == 'compileDebugJavaWithJavac' ||
                 it.name == 'compileReleaseJavaWithJavac' }.configureEach {
    dependsOn tasks.named('downloadSpotifyAppRemote')
}

// CPU ONNX runtime is included in the small APK; actual voice models download once.
dependencies {
    implementation files(spotifyRemoteAar)
    implementation 'com.google.code.gson:gson:2.10.1'
    // Supertonic upstream Java ONNX helper JSON parser (local inference only).
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    // TDLib MTProto client for Telegram personal-account authorization.
    // Prebuilt Android AAR contains Java JNI bindings and native libs.
    implementation 'io.github.tdlib-android:core:0.1.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Never complete an unsigned release build inadvertently.
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' }.configureEach {
    doFirst {
        if (!stableSigningReady) {
            throw new GradleException('Stable signing is not configured. See android/RELEASE-SIGNING.md')
        }
    }
}
