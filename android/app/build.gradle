plugins {
    id 'com.android.application'
}

android {
    namespace 'com.andriy.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.andriy.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.1.4'
    }

    // Preview APK can coexist with previous JARVIS installs without signature conflict.
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            manifestPlaceholders = [appLabel: 'Джарвіс Тест']
        }
        release {
            manifestPlaceholders = [appLabel: 'Джарвіс']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
