plugins {
    id 'com.android.application'
}

// Stable signing requires a user-controlled keystore. Nothing private is checked into GitHub.
def stableKeystore = System.getenv('JARVIS_RELEASE_STORE_FILE')
def stableStorePassword = System.getenv('JARVIS_RELEASE_STORE_PASSWORD')
def stableAlias = System.getenv('JARVIS_RELEASE_KEY_ALIAS')
def stableKeyPassword = System.getenv('JARVIS_RELEASE_KEY_PASSWORD')
def stableSigningReady = [stableKeystore, stableStorePassword, stableAlias, stableKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace 'com.andriy.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.andriy.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 24
        versionName '0.1.14'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        jarvisStable {
            if (stableSigningReady) {
                storeFile file(stableKeystore)
                storePassword stableStorePassword
                keyAlias stableAlias
                keyPassword stableKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Debug is for CI/local testing only; ephemeral signing cannot deliver in-place updates.
            applicationIdSuffix '.preview'
            manifestPlaceholders = [appLabel: 'Джарвіс Тест']
        }
        release {
            // Freeze this stable applicationId forever; changes break in-place upgrades.
            // All later stable releases can upgrade in-place with the same signing key.
            applicationIdSuffix '.stable'
            manifestPlaceholders = [appLabel: 'Джарвіс']
            if (stableSigningReady) signingConfig signingConfigs.jarvisStable
            minifyEnabled false
        }
        // Alternative QA build without the accessibility service manifest entry.
        // It contains no cross-app screen access; do not imply that screen control works.
        // Uses the SAME stable package ID and certificate for an in-place update.
        lite {
            initWith release
            applicationIdSuffix '.stable'
            versionNameSuffix '-lite'
            manifestPlaceholders = [appLabel: 'Джарвіс Lite']
            if (stableSigningReady) signingConfig signingConfigs.jarvisStable
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// CPU ONNX runtime is included in the small APK; actual voice models download once.
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

// Never complete an unsigned release build inadvertently.
tasks.matching { it.name == 'assembleRelease' || it.name == 'bundleRelease' || it.name == 'assembleLite' || it.name == 'bundleLite' }.configureEach {
    doFirst {
        if (!stableSigningReady) {
            throw new GradleException('Stable signing is not configured. See android/RELEASE-SIGNING.md')
        }
    }
}
