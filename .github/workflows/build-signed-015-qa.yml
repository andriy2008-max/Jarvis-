name: Signed full Jarvis QA APK only (manual request)

# Only signed test artifacts. Never publish a stable GitHub release.
on:
  # Manually triggered only after an explicit user instruction. No APK jobs on push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore ORIGINAL signing certificate
        env:
          B64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${B64:?Missing Jarvis stable keystore}"
          : "${JARVIS_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${JARVIS_RELEASE_KEY_ALIAS:?Missing alias}"
          : "${JARVIS_RELEASE_KEY_PASSWORD:?Missing key password}"
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/jarvis-stable.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-stable.jks"
          echo "JARVIS_RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-stable.jks" >> "$GITHUB_ENV"
      - name: Build QA with stable signing and updated version
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          QA_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          task=assembleRelease
          gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest ":app:$task"
      - name: Check exact certificate, update-safe ID, Quick tile and Lite privacy
        env:
          QA_VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/$QA_VARIANT/app-$QA_VARIANT.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          expected="$(tr -d '[:space:]' < android/RELEASE-CERT-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/jarvis-badging
          grep -Fq "package: name='com.andriy.jarvis.stable'" /tmp/jarvis-badging
          grep -Fq "versionCode='25'" /tmp/jarvis-badging
          name=0.1.15
          grep -Fq "versionName='$name'" /tmp/jarvis-badging
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/jarvis-manifest
          grep -Fq 'JarvisQuickTileService' /tmp/jarvis-manifest
          grep -Fq 'FloatingJarvisService' /tmp/jarvis-manifest
          mkdir -p android/dist
          cp "$apk" "android/dist/JARVIS-0.1.15-$QA_VARIANT-SIGNED-QA.apk"
          (cd android/dist && sha256sum "JARVIS-0.1.15-$QA_VARIANT-SIGNED-QA.apk" > "JARVIS-0.1.15-$QA_VARIANT-SIGNED-QA.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-0.1.15-${{ matrix.variant }}-SIGNED-phone-QA
          retention-days: 7
          if-no-files-found: error
          path: android/dist/*
      - name: Destroy CI signing key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-stable.jks"
