name: Signed Dimon 0.1.41 user-requested QA APK
on:
  push:
    branches: [fix/watch7-three-user-qa-issues-no-apk]
    paths: [.github/workflows/build-qa-0141-once.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore stable signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing original signing key}"
          : "${JARVIS_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${JARVIS_RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${JARVIS_RELEASE_KEY_PASSWORD:?Missing key password}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-stable.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-stable.jks"
          echo "JARVIS_RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-stable.jks" >> "$GITHUB_ENV"
      - name: Run tests and assemble signed APK
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease
      - name: Verify package, version and pinned signing certificate
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          expected="$(tr -d '[:space:]' < android/RELEASE-CERT-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.andriy.jarvis.stable'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='51'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='0.1.41'" "$RUNNER_TEMP/badging.txt"
          mkdir -p android/dist
          cp "$apk" android/dist/Dimon-0.1.41-signed-QA.apk
          (cd android/dist && sha256sum Dimon-0.1.41-signed-QA.apk > Dimon-0.1.41-signed-QA.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Dimon-0.1.41-signed-QA
          retention-days: 7
          if-no-files-found: error
          path: |
            android/dist/Dimon-0.1.41-signed-QA.apk
            android/dist/Dimon-0.1.41-signed-QA.sha256
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/jarvis-stable.jks"
