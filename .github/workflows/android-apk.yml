name: Android APK (Jarvis)

# APK builds are manual-only. No automatic builds on GitHub commits.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify all three command parsers
        run: |
          set -euo pipefail
          mkdir -p android/build/parser-tests
          javac -encoding UTF-8 -d android/build/parser-tests \
            android/app/src/main/java/com/andriy/jarvis/CommandPatterns.java \
            android/app/src/main/java/com/andriy/jarvis/AssistantIntents.java \
            android/app/src/main/java/com/andriy/jarvis/AppNameMatcher.java \
            android/app/src/test/java/com/andriy/jarvis/CommandPatternsTest.java \
            android/app/src/test/java/com/andriy/jarvis/AssistantIntentsTest.java \
            android/app/src/test/java/com/andriy/jarvis/AppNameMatcherTest.java
          for test in CommandPatternsTest AssistantIntentsTest AppNameMatcherTest; do
            java -cp android/build/parser-tests "com.andriy.jarvis.$test"
          done
      - name: Compile preview APK — pass 1
        run: gradle -p android --no-daemon --stacktrace :app:assembleDebug
      - name: Compile preview APK — pass 2
        run: gradle -p android --no-daemon --rerun-tasks --stacktrace :app:assembleDebug
      - name: Validate APK signature and distinct installation ID
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > /tmp/preview-badging.txt
          cat /tmp/preview-badging.txt | head -12
          grep -q "package: name='com.andriy.jarvis.preview'" /tmp/preview-badging.txt
          grep -q "versionCode='14'" /tmp/preview-badging.txt
          grep -q "versionName='0.1.4'" /tmp/preview-badging.txt
          mkdir -p android/dist
          cp "$apk" android/dist/JARVIS-0.1.4-Preview.apk
          sha256sum android/dist/JARVIS-0.1.4-Preview.apk | tee android/dist/JARVIS-0.1.4-Preview.sha256
      - name: Upload installable preview APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-0.1.4-Preview-APK
          path: |
            android/dist/JARVIS-0.1.4-Preview.apk
            android/dist/JARVIS-0.1.4-Preview.sha256
          if-no-files-found: error
      - name: Publish preview APK in separate release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.4-preview \
            android/dist/JARVIS-0.1.4-Preview.apk \
            android/dist/JARVIS-0.1.4-Preview.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'JARVIS 0.1.4 Preview — встановлюється поруч зі старим' \
            --notes 'Тестовий APK: окремий applicationId com.andriy.jarvis.preview, щоб уникнути конфлікту підпису зі старими debug-версіями. Встановлюється поряд зі старим Джарвісом, не переносить старі нотатки. GitHub Actions перевіряє парсери, двічі збирає, перевіряє підпис, ідентифікатор пакета та контрольну суму.'
