name: Android APK (Jarvis)

# Manual only. Building or publishing must be explicitly requested.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'stable = user-updatable permanently signed APK; preview = NOT for upgrading installed app'
        required: true
        type: choice
        options:
          - preview
          - stable
        default: stable

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify command parser regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/build/parser-tests
          javac -encoding UTF-8 -d android/build/parser-tests \
            android/app/src/main/java/com/andriy/jarvis/CommandPatterns.java \
            android/app/src/main/java/com/andriy/jarvis/AssistantIntents.java \
            android/app/src/main/java/com/andriy/jarvis/AppNameMatcher.java \
            android/app/src/main/java/com/andriy/jarvis/DeviceCommands.java \
            android/app/src/main/java/com/andriy/jarvis/AiChatPolicy.java \
            android/app/src/main/java/com/andriy/jarvis/WakeConversation.java \
            android/app/src/main/java/com/andriy/jarvis/TimerRules.java \
            android/app/src/main/java/com/andriy/jarvis/JarvisWearProtocol.java \
            android/app/src/main/java/com/andriy/jarvis/JarvisWearReplyPages.java \
            android/app/src/main/java/com/andriy/jarvis/VoiceRanking.java \
            android/app/src/main/java/com/andriy/jarvis/NeuralSpeechPolicy.java \
            android/app/src/main/java/com/andriy/jarvis/OfflineVoicePackRules.java \
            android/app/src/test/java/com/andriy/jarvis/CommandPatternsTest.java \
            android/app/src/test/java/com/andriy/jarvis/AssistantIntentsTest.java \
            android/app/src/test/java/com/andriy/jarvis/AppNameMatcherTest.java \
            android/app/src/test/java/com/andriy/jarvis/DeviceCommandsTest.java \
            android/app/src/test/java/com/andriy/jarvis/AiChatPolicyTest.java \
            android/app/src/test/java/com/andriy/jarvis/WakeConversationTest.java \
            android/app/src/test/java/com/andriy/jarvis/TimerRulesTest.java \
            android/app/src/test/java/com/andriy/jarvis/JarvisWearReplyPagesTest.java \
            android/app/src/test/java/com/andriy/jarvis/VoiceRankingTest.java \
            android/app/src/test/java/com/andriy/jarvis/NeuralSpeechPolicyTest.java \
            android/app/src/test/java/com/andriy/jarvis/OfflineVoicePackRulesTest.java
          for test in CommandPatternsTest AssistantIntentsTest AppNameMatcherTest DeviceCommandsTest AiChatPolicyTest WakeConversationTest TimerRulesTest JarvisWearReplyPagesTest VoiceRankingTest NeuralSpeechPolicyTest OfflineVoicePackRulesTest; do
            java -cp android/build/parser-tests "com.andriy.jarvis.$test"
          done
      - name: Restore stable signing keystore (stable only)
        if: inputs.variant == 'stable'
        shell: bash
        env:
          JARVIS_SIGNING_KEYSTORE_BASE64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${JARVIS_SIGNING_KEYSTORE_BASE64:?Missing GitHub secret JARVIS_SIGNING_KEYSTORE_BASE64}"
          : "${JARVIS_RELEASE_STORE_PASSWORD:?Missing GitHub secret JARVIS_RELEASE_STORE_PASSWORD}"
          : "${JARVIS_RELEASE_KEY_ALIAS:?Missing GitHub secret JARVIS_RELEASE_KEY_ALIAS}"
          : "${JARVIS_RELEASE_KEY_PASSWORD:?Missing GitHub secret JARVIS_RELEASE_KEY_PASSWORD}"
          printf '%s' "$JARVIS_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-stable.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-stable.jks"
          echo "JARVIS_RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-stable.jks" >> "$GITHUB_ENV"
      - name: Compile APK, pass 1
        shell: bash
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = stable ]; then
            gradle -p android --no-daemon --stacktrace :app:assembleRelease
          else
            gradle -p android --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Compile APK, pass 2
        shell: bash
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = stable ]; then
            gradle -p android --no-daemon --rerun-tasks --stacktrace :app:assembleRelease
          else
            gradle -p android --no-daemon --rerun-tasks --stacktrace :app:assembleDebug
          fi
      - name: Verify signature, package, version and checksum
        shell: bash
        run: |
          set -euo pipefail
          variant='${{ inputs.variant }}'
          if [ "$variant" = stable ]; then
            apk='android/app/build/outputs/apk/release/app-release.apk'
            package='com.andriy.jarvis.stable'
          else
            apk='android/app/build/outputs/apk/debug/app-debug.apk'
            package='com.andriy.jarvis.preview'
          fi
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          if [ "$variant" = stable ]; then
            # Never ship a new signing key as an alleged in-place update.
            expected="$(tr -d '[:space:]' < android/RELEASE-CERT-SHA256.txt | tr '[:upper:]' '[:lower:]')"
            actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Stable signing certificate does not match the pinned JARVIS identity."
              exit 1
            fi
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/jarvis-badging.txt"
          grep -Fq "package: name='$package'" "$RUNNER_TEMP/jarvis-badging.txt"
          version_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' android/app/build.gradle | head -n1)"
          version_name="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" android/app/build.gradle | head -n1)"
          test -n "$version_code" && test -n "$version_name"
          grep -Fq "versionCode='$version_code'" "$RUNNER_TEMP/jarvis-badging.txt"
          grep -Fq "versionName='$version_name'" "$RUNNER_TEMP/jarvis-badging.txt"
          mkdir -p android/dist
          cp "$apk" "android/dist/JARVIS-$version_name-$variant.apk"
          (cd android/dist && sha256sum "JARVIS-$version_name-$variant.apk" > "JARVIS-$version_name-$variant.sha256")
          echo "JARVIS_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "JARVIS_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
      - name: Upload verified APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ env.JARVIS_VERSION_NAME }}-${{ inputs.variant }}-APK
          path: |
            android/dist/JARVIS-${{ env.JARVIS_VERSION_NAME }}-${{ inputs.variant }}.apk
            android/dist/JARVIS-${{ env.JARVIS_VERSION_NAME }}-${{ inputs.variant }}.sha256
          if-no-files-found: error
      - name: Publish stable signed APK to direct GitHub release
        if: inputs.variant == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "android/dist/JARVIS-$JARVIS_VERSION_NAME-stable.apk"
          # A version tag is immutable: do not overwrite older release packages.
          if gh release view "v$JARVIS_VERSION_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$JARVIS_VERSION_NAME already exists. Bump versionCode and versionName."
            exit 1
          fi
          gh release create "v$JARVIS_VERSION_NAME" \
            "android/dist/JARVIS-$JARVIS_VERSION_NAME-stable.apk" \
            "android/dist/JARVIS-$JARVIS_VERSION_NAME-stable.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "JARVIS $JARVIS_VERSION_NAME — stable signed Android" \
            --notes 'Стабільний APK з постійним підписом та ID com.andriy.jarvis.stable. Збережи нотатки з попередніх тестових копій до їх видалення. Наступні stable-версії з більшим versionCode та тим самим сертифікатом оновлюватимуть цей застосунок.' \
            --prerelease
      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-stable.jks"
