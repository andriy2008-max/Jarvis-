name: Jarvis 0.1.16 stable-signed build (one-time user request)

# This file runs exactly for its creation commit, per the user's explicit APK request.
# It does NOT enable continuous APK building on later pushes.
on:
  push:
    paths:
      - '.github/workflows/jarvis-016-user-request.yml'

permissions:
  contents: write

jobs:
  signed-apk:
    if: github.event.head_commit.message == 'User-requested signed JARVIS v0.1.16 build (one-shot)'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 35
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore original stable signing key only
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Original release signing secret is missing}"
          : "${JARVIS_RELEASE_STORE_PASSWORD:?Missing release store password}"
          : "${JARVIS_RELEASE_KEY_ALIAS:?Missing release key alias}"
          : "${JARVIS_RELEASE_KEY_PASSWORD:?Missing release key password}"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          chmod 600 "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
      - name: Run unit tests and assemble signed full APK
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleRelease
      - name: Verify original certificate, application ID, version and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          expected="$(tr -d '[:space:]' < android/RELEASE-CERT-SHA256.txt | tr '[:upper:]' '[:lower:]')"
          actual="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          test "$expected" = "$actual"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.andriy.jarvis.stable'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionCode='26'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "versionName='0.1.16'" "$RUNNER_TEMP/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -Fq 'JarvisQuickTileService' "$RUNNER_TEMP/manifest.txt"
          grep -Fq 'FloatingJarvisService' "$RUNNER_TEMP/manifest.txt"
          grep -Fq 'ScreenControlAccessibilityService' "$RUNNER_TEMP/manifest.txt"
          mkdir -p android/dist
          cp "$apk" android/dist/JARVIS-0.1.16-stable.apk
          (cd android/dist && sha256sum JARVIS-0.1.16-stable.apk > JARVIS-0.1.16-stable.sha256)
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-0.1.16-original-signature-APK
          path: |
            android/dist/JARVIS-0.1.16-stable.apk
            android/dist/JARVIS-0.1.16-stable.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK link as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.16 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release tag exists; refusing replacement'
            exit 1
          fi
          gh release create v0.1.16             android/dist/JARVIS-0.1.16-stable.apk             android/dist/JARVIS-0.1.16-stable.sha256             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title 'JARVIS 0.1.16 — signed full Android update'             --prerelease             --notes 'Full Android build with floating Jarvis 8-bit face, synchronized speech captions and swipe-to-correct, sequential accessibility commands, background timer changes, Ukrainian voice options and expanded phone setting commands. The package and certificate match the stable Jarvis identity for update-in-place. Some Android system toggles require manual confirmation or system permissions. Offline voice model downloads are separate and experimental. Physical watch and phone speech/gesture behaviors have not been fully validated; prerelease for testing.'
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis-release.jks"
