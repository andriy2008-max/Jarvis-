name: Android real offline voices instrumentation (test only)

# Builds temporary debug + test packages; NEVER signs/releases the user-facing APK.
on:
  push:
    paths:
      - '.github/workflows/android-offline-instrumentation.yml'
      - 'android/app/src/androidTest/**'
      - 'android/app/src/main/java/com/andriy/jarvis/OfflineOnnxSynthesizer.java'
      - 'android/app/src/main/java/com/andriy/jarvis/UkrainianVoiceText.java'
      - 'android/app/src/main/java/com/andriy/jarvis/OfflineVoicePackManager.java'
      - 'android/app/build.gradle'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  android-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK and compile ONLY temporary test packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle -p android --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Retrieve and validate real 145 MB VITS voice pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/jarvis-voice-fixture
          gh run download 42779515189 --repo "$GITHUB_REPOSITORY" --name jarvis-dmytro-lada-onnx-experimental --dir /tmp/jarvis-voice-fixture
          printf '%s  %s\n' '12fdd6521ae864f5eafac2d5a205d32f299ba65229800dafbd647b4a3ff8e0d5' '/tmp/jarvis-voice-fixture/jarvis-uktts-v6-onnx.zip' | sha256sum --check
          unzip -oq /tmp/jarvis-voice-fixture/jarvis-uktts-v6-onnx.zip -d /tmp/jarvis-voice-fixture/model
          test -s /tmp/jarvis-voice-fixture/model/manifest.json
          test -s /tmp/jarvis-voice-fixture/model/onnx/full/vits.onnx
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo "KVM unavailable"; fi
      - name: Run actual ONNX Runtime and MediaPlayer on Android with airplane mode
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            voiceDir=/sdcard/Android/data/com.andriy.jarvis.preview/files/voice-fixture
            adb shell mkdir -p "$voiceDir/onnx/full"
            adb push /tmp/jarvis-voice-fixture/model/manifest.json "$voiceDir/manifest.json"
            adb push /tmp/jarvis-voice-fixture/model/onnx/full/vits.onnx "$voiceDir/onnx/full/vits.onnx"
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true
            adb shell settings get global airplane_mode_on | grep -x 1
            adb shell am instrument -w -r com.andriy.jarvis.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/jarvis-android-instrumentation.log
            grep -q 'OK (1 test)' /tmp/jarvis-android-instrumentation.log
            adb logcat -d -s JARVIS_OFFLINE_TEST:I '*:S'
      - name: Provide error logs only when emulator test fails
        if: failure()
        run: |
          if [ -f /tmp/jarvis-android-instrumentation.log ]; then cat /tmp/jarvis-android-instrumentation.log; fi
