name: Experimental real Dmytro and Lada ONNX export

# One-shot on creation and manual re-runs. Never ships an untested model or APK.
on:
  push:
    paths:
      - '.github/workflows/export-uktts-onnx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Disk capacity
        run: df -h . /tmp
      - name: Install official upstream and ONNX tooling
        run: |
          python -m pip install --upgrade pip
          # ESPnet 202301 needs a legacy CPU-compatible PyTorch & matching audio backend.
          # Avoid pulling the many-gigabyte latest CUDA PyTorch.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.2+cpu torchaudio==2.1.2+cpu
          python -m pip install -r server/jarvis-tts-server/requirements.txt
          python -m pip install espnet_onnx onnx onnxruntime pyyaml
          # ESPnet 202301 expects the SciPy 1.x signal API; a newer SciPy removed kaiser.
          # ONNX 1.14.x and protobuf 3.20.x are the compatible legacy export path.
          python -m pip install 'scipy==1.10.1' 'protobuf==3.20.3' 'onnx==1.14.1' 'onnxruntime==1.20.0'
          python -m pip check || true
      - name: Real ONNX synthesis of both voices
        run: |
          python -u tools/voice-export/export_voice_pack.py --cache-dir /tmp/uktts-v6-cache --output /tmp/jarvis-uktts-v6-onnx.zip
          sha256sum /tmp/jarvis-uktts-v6-onnx.zip | tee /tmp/jarvis-uktts-v6-onnx.sha256
      - name: Upload ONLY if both speakers synthesized with real model
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-dmytro-lada-onnx-experimental
          path: |
            /tmp/jarvis-uktts-v6-onnx.zip
            /tmp/jarvis-uktts-v6-onnx.sha256
          retention-days: 1
          compression-level: 0
