permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Personal AI Worker tests (mocked OpenAI requests)
        run: node --test server/jarvis-ai-worker/test/*.test.mjs
      - name: Python server contract (without model download)
        run: python -m unittest discover -s server/jarvis-tts-server -p 'test_*.py' -v
      - name: Export package contract (no model download)
        run: python -m unittest discover -s tools/voice-export -p 'test_*.py' -v
