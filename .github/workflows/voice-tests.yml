  song_recognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recognition phrases and playback isolation
        run: |
          mkdir -p /tmp/song-tests
          javac -encoding UTF-8 -d /tmp/song-tests android/app/src/main/java/com/andriy/jarvis/CommandPatterns.java android/app/src/main/java/com/andriy/jarvis/SongRecognitionCommands.java android/app/src/test/java/com/andriy/jarvis/SongRecognitionCommandsTest.java
          java -cp /tmp/song-tests com.andriy.jarvis.SongRecognitionCommandsTest

  android_compile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Android code only (does not build an APK)
        run: gradle -p android --no-daemon --stacktrace :app:compileDebugJavaWithJavac
